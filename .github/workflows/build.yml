name: build

on:
  push:
  pull_request:

jobs:
  mod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          sudo luarocks install luacheck
          sudo luarocks --lua-version 5.3 install luasocket
      - name: Lint
        run: luacheck mod/ tests/
      - name: Mod tests
        run: lua5.3 tests/run.lua

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and screen previews
        run: ./gradlew --no-daemon :app:testDebugUnitTest :preview:test
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: isaac-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: screen-previews
          path: android/preview/build/screens/*.png
